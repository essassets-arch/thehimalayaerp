name: Deploy ERP to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute remote deployment script over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            if [ -d "/home/himalay/the_himalaya_erp" ]; then
              cd /home/himalay/the_himalaya_erp
            elif [ -d "/opt/himalaya-erp" ]; then
              cd /opt/himalaya-erp
            fi
            chmod +x ./scripts/deploy-vps.sh || true
            ./scripts/deploy-vps.sh
