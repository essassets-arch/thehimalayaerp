name: Deploy ERP to VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute remote deployment script over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            TARGET_DIR=""
            for dir in \
              "/home/deploy/the_himalaya_erp" \
              "/opt/the_himalaya_erp" \
              "$HOME/the_himalaya_erp" \
              "/home/himalay/the_himalaya_erp" \
              "/home/himalaya/the_himalaya_erp" \
              "/opt/himalaya-erp"; do
              if [ -d "$dir" ]; then
                TARGET_DIR="$dir"
                break
              fi
            done

            if [ -n "$TARGET_DIR" ]; then
              echo "Deploying in $TARGET_DIR..."
              cd "$TARGET_DIR"
              chmod +x ./scripts/deploy-vps.sh || true
              ./scripts/deploy-vps.sh
            else
              echo "Error: Could not locate Himalaya ERP project directory on VPS."
              pwd && ls -la
              exit 1
            fi
